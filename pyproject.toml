[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrbc-reporting-dashboard"
version = "0.1.0"
description = "Daily birth and ID registration reporting dashboard with data-quality checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.35,<2",
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "plotly>=5.20,<7",
  "pymongo[srv]>=4.6,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "mongomock>=4.1,<5",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
